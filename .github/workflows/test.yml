name: test
on:
  push:
    # A v* tag is release.yml's: its verify runs this suite on every target
    # and gates the publish, so a test run on the tag would only repeat it.
    tags-ignore: ["v*"]
    branches: ["**"]
  pull_request:

# A newer push to the same branch supersedes the run before it.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A release's own merge to main ("[release]" in its message) is tagged at
    # once, and the tag's verify runs this suite on the same commit.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) }}
    strategy:
      # The first failure is the answer: stop the other platform's run.
      fail-fast: true
      matrix:
        # macOS runs on main, tags and pull requests. A branch is checked on
        # both platforms before it's pushed (scripts/ci-local), so a branch
        # push gets the Linux run alone.
        os: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -o build/bowery ./cmd/bowery
      # Black-box: the built binary through its CLI, against the fake herdr
      # and ssh in tests/fakes/ (no herdr needed on the runner).
      - run: BOWERY_BIN=$PWD/build/bowery python -m unittest discover -v tests
