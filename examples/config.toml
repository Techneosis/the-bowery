# ~/.config/bowery/config.toml — every key is optional; `bowery config` shows
# what is in force. These are the defaults, plus one example machine.

# The workspace dispatched agents get a tab in by default (one call can name
# another with --space <label>).
swarm = "swarm"

# The pane-metadata source the sound=off token is reported under. A sound
# plugin reads the token (sound=off); the source only says who set it.
sound_source = "bowery.sound"

# Claude's "trust this folder?" dialog is answered Yes under these, and always
# under the herdr worktrees dir. ~ is the home of the machine the pane is on.
trust_roots = ["~/dev"]

# Environment variables that mark a process as another tool's (a review
# harness, say). resume never starts an agent in a pane whose shell or
# foreground processes carry one. Default: none.
# hands_off_env = ["OTHER_TOOL_TAG"]

# Identities for agents on this machine's own server, the same contract as a
# machine's identity_command below. With it, a local dispatch may take --as;
# without it, --as needs --machine. (Top-level keys go before the first
# [table], or TOML puts them in it.)
# identity_command = "~/bin/as"
# identity_env = "BOWERY_AS"

# Short names for --model. Anything not listed is passed through as written.
[models]
# fast = "claude-haiku-4-5"

# A saved herdr machine (`herdr machine list`), by its label.
[machines.swarm-box]
# Runs things as a person on the box: `<cmd> <who>` is their shell,
# `<cmd> <who> <argv...>` runs argv as them, and both export identity_env=<who>.
# With it, --as is required for this machine; without it, --as is refused.
# Use a full path: a non-login ssh session has a short PATH.
identity_command = "~/bin/as"
identity_env = "BOWERY_AS"
# The ssh destination for git and file checks (default: the profile's target).
# ssh = "swarm-box"
# Trust roots on the box (default: the top-level trust_roots).
# trust_roots = ["~/dev", "~/src"]

# Placement into offices (bowery place, and dispatch with job flags).
[placement]
# The regions this bowery plans over: its own (from the region file), and
# any of the peers that file declares. Default: its own.
# consider.regions = ["region-a"]
# An allow list of offices; empty means every office those regions publish.
# consider.offices = []
# Ranking, in order. Default: prefer, holds-repo, same-machine, same-region, fewest-running.
# rank = ["prefer", "holds-repo", "same-machine", "same-region", "fewest-running"]
# Offices, or regions as "region:<name>", for the prefer criterion.
# prefer = ["region:region-a"]
# A job of this scope is never placed outside these regions.
# never = [{ scope = "acme", outside = ["region-a"] }]
# The placement transport, by name; the offices' machine files name the same.
# transport = "dir"
# The office host to ask. Default: office, on PATH.
# office_command = "office"
# The private keys placements are signed with, by asker. Default for the
# invoking user's own: ~/.ssh/id_ed25519.
# keys = { alice = "~/.ssh/id_ed25519", manager-1 = "~/.config/bowery/keys/manager-1" }
# This region's private key: seals a placement sent to a peer region.
# region_key = "~/.config/bowery/keys/region-a"

# Defaults for one job kind (a flag on the command line wins).
# [placement.kinds.review]
# surface  = "herdr:reviewer"
# priority = "normal"
# expires  = "4h"
# pin      = []
# prefer   = ["region-a-reviews"]
