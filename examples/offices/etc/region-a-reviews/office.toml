# The office record: /usr/local/etc/offices/<office>/office.toml (root:root
# 0644), with the lists it names beside it. Its state (the owner's open or
# closed) is /var/lib/offices/<office>/state, written by office open|close.
name     = "region-a-reviews"
region   = "region-a"
machine  = "box-1"
user     = "region-a-reviews"
owner    = "alice"
tier     = "reader"
acts_for = ""
kinds    = ["review"]
profile  = "reviewer"
surfaces = ["reviewer"]

signers = "signers"          # who may place here: ssh-keygen allowed_signers lines (a peer's as name@region)

[holdings]
tools = ["git"]
repos = "repos"

[rules]
default   = "closed"         # when no rule has an opinion
on_closed = "yield"          # what a closing rule (or the owner) asks of running work
interval  = "10s"            # how often run-phase rules look at running work

[[rules.use]]
name   = "work-hours"
plugin = "hours"
[rules.use.config]
windows = ["Mon..Fri 09:00-17:00"]

[[rules.use]]
name   = "desk"
plugin = "desk-gate"         # the gate above: open in a slot and while nobody is at the desk
