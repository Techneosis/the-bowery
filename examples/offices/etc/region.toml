# The region file: /usr/local/etc/offices/region.toml (root:root 0644), or
# $OFFICE_ROOT/etc/region.toml in dev mode. Every machine in the region has it.
region   = "region-a"
owner    = "alice"
timezone = "Europe/Lisbon"
key      = "ssh-ed25519 AAAA… region-a"     # the region's public key; it seals placements to peers and signs catalogs
offices  = [{ name = "region-a-reviews", machine = "box-1" }]

priorities       = ["high", "normal", "low"]   # highest first: the order waiting jobs retry in
reserved_effects = ["spend"]                   # never placed anywhere (bowery place exits 3)
max_expires      = "24h"

[tiers.reader]
effects = []
holds   = ["tools", "repos"]

[naming]
user_max = 32
box      = "office-{name}"   # the office's inbox

[defaults]
rule_timeout = "2s"          # how long a rule may take to answer
retry_tick   = "10m"         # how often a waiting placement is judged again without an event
# rule_default, on_closed and interval: defaults for each office's [rules]

# A peer region (both files must declare each other). What it may do *here*:
# the offices it may place into, and rules every placement from it must also
# pass. address is the transport's: for "dir", the peer's var directory; for
# "http", the URL of its machine's office serve (https://box-2.example.net:8470).
[peers.region-b]
address   = "/var/lib/offices-region-b"
key       = "ssh-ed25519 AAAA… region-b"   # pinned: a seal or catalog by any other key is no link
may_place = ["region-a-reviews"]
may_view  = []
# The bus topics region-b may publish into this region, and read from it.
# Default none. A pattern is "*", a prefix like "job.*" (whole parts, any
# depth) or one topic exactly. Both nodes check: what leaves here is checked
# against may_read, what arrives against may_publish.
may_publish = ["job.*"]
may_read    = ["card.answered"]
[[peers.region-b.rules]]
name   = "region-b-hours"
plugin = "hours"
[peers.region-b.rules.config]
windows = ["Mon..Fri 18:00-23:00"]

# The bus (pkg/bus): how long topics are kept, the topics that never leave
# this region, and what its local seats (by Unix user) may publish and read.
[bus]
retention = "720h"            # the default: 30 days
private   = ["private.*"]     # never sent to a peer, whatever its may_read; no peer publishes into them

[bus.retain]                  # per topic; the most specific pattern wins
"job.*" = "168h"

[bus.seats.alice]
publish = ["job.*", "private.*"]
read    = ["card.answered", "private.*"]

# Rule instances every office in the region carries:
# [[defaults.rules]]
# name   = "region-hours"
# plugin = "hours"
# [defaults.rules.config]
# windows = ["Mon..Fri 08:00-20:00"]
